# Startet den MQTT-Broker (Mosquitto)
# Start:  docker compose -f infra/docker-compose.yml up -d
# Stopp:  docker compose -f infra/docker-compose.yml down
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: afz-mosquitto
    ports:
      - "1883:1883"   # MQTT unverschluesselt (gut fuer Wireshark-Analysen)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
